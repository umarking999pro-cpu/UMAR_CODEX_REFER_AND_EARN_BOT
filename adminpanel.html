<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}.wrap{max-width:1100px;margin:auto;padding:16px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button,.btn{padding:10px 12px;border:0;border-radius:10px;background:#273352;color:#fff;cursor:pointer}.nav button.active,.primary{background:#6c63ff}.panel{display:none}.panel.active{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#121a2d;border:1px solid #202b45;border-radius:15px;padding:14px;margin-bottom:10px}.stat b{font-size:22px;display:block;margin-top:4px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #263352;background:#0e1629;color:#fff;margin:5px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.danger{background:#a92e4d}.ok{background:#167953}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #263352;font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:10px;display:none}.small{color:#91a0bd;font-size:12px}@media(max-width:600px){.row{grid-template-columns:1fr}table{display:block;overflow:auto}}</style></head><body><div class="wrap"><h1>Admin Panel</h1><div class="nav"><button class="active" data-p="dash">Dashboard</button><button data-p="tasks">Tasks</button><button data-p="withdrawals">Withdrawals</button><button data-p="users">Users</button><button data-p="ann">Announcements</button></div><section id="dash" class="panel active"><div class="cards"><div class="card stat">Users<b id="sUsers">0</b></div><div class="card stat">Withdrawals<b id="sW">0</b></div><div class="card stat">Pending<b id="sP">0</b></div><div class="card stat">Approved<b id="sA">0</b></div><div class="card stat">Paid<b id="sPaid">₹0</b></div></div><h2>Activity</h2><div id="activity"></div></section><section id="tasks" class="panel"><div class="card"><h2>Add Task</h2><div class="row"><input id="tn" placeholder="Task name"><select id="tt"><option>Join Channel</option><option>Visit Link</option><option>Watch Ads</option><option>Custom</option></select></div><div class="row"><input id="tr" type="number" placeholder="Reward"><input id="tl" placeholder="Link"></div><button class="btn primary" onclick="addTask()">Save Task</button></div><div id="taskList"></div></section><section id="withdrawals" class="panel"><div class="nav" id="filters"><button class="active" onclick="setFilter('all',this)">All</button><button onclick="setFilter('pending',this)">Pending</button><button onclick="setFilter('approved',this)">Approved</button><button onclick="setFilter('rejected',this)">Rejected</button></div><div id="wList"></div></section><section id="users" class="panel"><div class="card"><input id="userSearch" placeholder="Search user ID or name"><button class="btn primary" onclick="searchUser()">Search</button></div><div id="userList"></div></section><section id="ann" class="panel"><div class="card"><input id="at" placeholder="Title"><textarea id="ab" placeholder="Body"></textarea><button class="btn primary" onclick="postAnnouncement()">Post</button></div><div id="annList"></div></section></div><div id="toast" class="toast"></div><script>
const firebaseConfig={apiKey:"",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};const ADMIN_KEY="Admim123";let db,adminId='admin',filter='all',withdrawals=[];function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}function auth(){const k=prompt('ADMIN_KEY');if(k!==ADMIN_KEY){document.body.innerHTML='<h2 style="padding:30px">Access denied</h2>';throw Error('Denied')}}function init(){firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth();listen()}function listen(){db.collection('users').onSnapshot(s=>document.getElementById('sUsers').textContent=s.size);db.collection('withdrawals').orderBy('createdAt','desc').onSnapshot(s=>{withdrawals=s.docs.map(x=>({id:x.id,...x.data()}));renderW();const p=withdrawals.filter(x=>x.status==='pending').length,a=withdrawals.filter(x=>x.status==='approved');document.getElementById('sW').textContent=withdrawals.length;document.getElementById('sP').textContent=p;document.getElementById('sA').textContent=a.length;document.getElementById('sPaid').textContent='₹'+a.reduce((z,x)=>z+Number(x.amount||0),0).toLocaleString('en-IN')});db.collection('tasks').orderBy('createdAt','desc').onSnapshot(s=>{document.getElementById('taskList').innerHTML=s.docs.map(x=>`<div class="card"><b>${esc(x.data().name)}</b><div class="small">${esc(x.data().type)} · ₹${x.data().reward||0}</div><div class="actions"><button class="btn danger" onclick="deleteTask('${x.id}')">Delete</button></div></div>`).join('')});db.collection('announcements').orderBy('createdAt','desc').limit(20).onSnapshot(s=>document.getElementById('annList').innerHTML=s.docs.map(x=>`<div class="card"><b>${esc(x.data().title)}</b><p>${esc(x.data().body||'')}</p><button class="btn danger" onclick="delAnn('${x.id}')">Delete</button></div>`).join(''));db.collection('withdrawals').orderBy('createdAt','desc').limit(5).onSnapshot(s=>document.getElementById('activity').innerHTML=s.docs.map(x=>`<div class="card">Withdrawal ₹${x.data().amount||0} · ${x.data().status}</div>`).join(''))}
function esc(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function log(action,target,details=''){await db.collection('admin_actions').add({adminId,action,targetId:target,details,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}async function addTask(){const name=tn.value.trim(),reward=Number(tr.value),link=tl.value.trim();if(!name||!reward)return toast('Task name and reward required');const r=await db.collection('tasks').add({name,type:tt.value,reward,link,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await log('create_task',r.id,name);toast('Task added')}async function deleteTask(id){if(!confirm('Delete task?'))return;await db.doc('tasks/'+id).delete();await log('delete_task',id);toast('Deleted')}function setFilter(f,b){filter=f;document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderW()}async function renderW(){const arr=filter==='all'?withdrawals:withdrawals.filter(x=>x.status===filter);const users={};for(const x of arr){if(!users[x.userId]){const s=await db.doc('users/'+x.userId).get();users[x.userId]=s.exists?s.data():{}}}document.getElementById('wList').innerHTML=arr.map(x=>`<div class="card"><b>${esc(users[x.userId]?.name||x.userId)}</b><div class="small">${esc(x.userId)} · ${esc(x.upi||'')}</div><p>₹${x.amount||0} · ${x.status}</p>${x.status==='pending'?`<div class="actions"><button class="btn ok" onclick="approve('${x.id}')">Approve</button><button class="btn danger" onclick="reject('${x.id}')">Reject</button></div>`:''}</div>`).join('')||'<div class="card">No requests.</div>'}async function approve(id){const wr=db.doc('withdrawals/'+id);await db.runTransaction(async tx=>{const w=await tx.get(wr);if(!w.exists||w.data().status!=='pending')throw Error('Already processed');const d=w.data(),ur=db.doc('users/'+d.userId),u=await tx.get(ur);tx.update(wr,{status:'approved'});tx.update(ur,{totalWithdrawals:firebase.firestore.FieldValue.increment(Number(d.amount||0)),coins:firebase.firestore.FieldValue.increment(-Number(d.amount||0))});tx.set(db.collection('announcements').doc(),{title:`${u.data()?.name||d.userId} withdrawal ₹${d.amount}`,body:'Withdrawal approved',createdAt:firebase.firestore.FieldValue.serverTimestamp()});});await log('approve_withdrawal',id);toast('Approved')}async function reject(id){await db.doc('withdrawals/'+id).update({status:'rejected'});await log('reject_withdrawal',id);toast('Rejected')}async function postAnnouncement(){const title=at.value.trim(),body=ab.value.trim();if(!title)return toast('Title required');await db.collection('announcements').add({title,body,createdAt:firebase.firestore.FieldValue.serverTimestamp()});at.value='';ab.value='';toast('Posted')}async function delAnn(id){await db.doc('announcements/'+id).delete();toast('Deleted')}async function searchUser(){const q=userSearch.value.trim().toLowerCase();if(!q)return;const s=await db.collection('users').limit(100).get();const hits=s.docs.filter(x=>x.id.toLowerCase().includes(q)||(x.data().name||'').toLowerCase().includes(q));document.getElementById('userList').innerHTML=hits.map(x=>{const d=x.data();return `<div class="card"><b>${esc(d.name)}</b><div class="small">${x.id}</div><p>Coins: ${d.coins||0} · Referrals: ${d.reffer||0}</p><div class="actions"><button class="btn" onclick="adjust('${x.id}',100)">+100</button><button class="btn danger" onclick="adjust('${x.id}',-100)">-100</button></div></div>`}).join('')||'<div class="card">No user found.</div>'}async function adjust(id,delta){await db.doc('users/'+id).update({coins:firebase.firestore.FieldValue.increment(delta)});await log('adjust_coins',id,String(delta));toast('Updated')}document.querySelectorAll('.nav:not(#filters) button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav:not(#filters) button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.p))});init();</script></body></html>
